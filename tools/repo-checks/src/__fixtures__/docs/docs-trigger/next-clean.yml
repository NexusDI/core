name: Docs next
on:
  push:
    branches: ['release/**']
    paths:
      - 'apps/docs/**'
      - 'libs/**'
      - 'internal/**'
      - 'examples/meridian/**'
      - 'tools/doc-examples/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run docs.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
