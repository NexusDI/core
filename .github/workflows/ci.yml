name: CI

on:
  push:
    # Every branch a ruleset protects: the stable line, the release/X.Y
    # prerelease lines and the X.Y.x maintenance lines. The release workflow
    # requires the four ruleset checks green on the exact commit it releases,
    # and only a push run produces them for that commit.
    #
    # sync/** too: the release workflow opens a sync pull request with the
    # job token, and GitHub starts no pull_request run for a pull request the
    # job token opened. The deploy key's push of the sync branch does start
    # this run, and its checks report on the pull request's head commit.
    branches:
      - main
      - 'release/**'
      - '[0-9]*.x'
      - 'sync/**'
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  # An invalid workflow file does not fail a job, because no job runs. GitHub
  # records a run with no jobs and the message "This run likely failed because
  # of a workflow file issue", and a workflow that only triggers manually shows
  # that against every push. actionlint reads the files as GitHub's schema
  # does, so the error surfaces in a job that can actually go red.
  #
  # Separate from `main` so it reports on its own, and first because it takes
  # seconds.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      # Pinned by version and checksum rather than installed through a
      # third-party action: the binary is the whole dependency, and verifying
      # it is two lines.
      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" actionlint
          ./actionlint -color

  # Prettier directly rather than `nx format:check`: the nx command is scoped
  # to what changed against a base ref, so it reports nothing when the base is
  # the commit being pushed, and on a pull request it reports only the files
  # in the diff -- a file left unformatted in the base passes. Formatting is a
  # property of the working tree, not of a project, so the check has to read
  # every file.
  #
  # Its own job rather than part of `main`, so a missing `nx format:write` is
  # reported in the time of an install instead of behind a full build.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # From the lockfile, so the check runs with the prettier version the
      # repository pins. `--ignore-scripts` because the only lifecycle script
      # is husky installing git hooks, which nothing in this job uses.
      - run: npm ci --ignore-scripts

      - run: npx prettier --check .

  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # `react-router typegen` writes the +types/*.d.ts files
      # examples/bridge-console reaches through tsconfig.app.json's rootDirs. On a
      # fresh checkout they don't exist yet. typecheck's own Nx target
      # dependency (dependsOn: [typegen, ...]) already produces them in time
      # for tsc; this step is for fallow below, which cannot see rootDirs at
      # all (it isn't a tsc feature any generic resolver implements --
      # .fallowrc.jsonc's ignoreUnresolvedImports is what actually silences
      # the finding). Kept anyway: fallow's built-in react-router plugin may
      # grow rootDirs support later, and generating the files first costs
      # nothing extra to keep correct regardless.
      #
      # `nx run <project>:typegen` rather than `run-many -t typegen`, so this
      # isn't a second `nx run-many` step in this job --
      # tools/repo-checks/src/release-verify-gate.test.ts asserts there is
      # exactly one, the actual gate below.
      - run: npx nx run @nexusdi/bridge-console:typegen

      # A step in this job rather than a job of its own: it needs the install
      # and nothing else, and it costs seconds against the minute that
      # `npm ci` already costs. Ahead of `run-many` so a dead file or a new
      # copy of an existing block reports in seconds instead of behind a
      # full build.
      - run: npx fallow dead-code --fail-on-issues && npx fallow dupes

      # core's test target depends on test-browser (regression R20), which
      # runs in Chromium through Playwright.
      - run: npx playwright install --with-deps chromium

      # The federation demo projects carry the demo-frontend tag. They build
      # with rspack, and the demo-apps job below runs their targets, so this
      # step and release.yml's verify step leave them out. bridge-api and
      # bridge-console carry only the demo tag and stay here.
      - run: npx nx run-many -t lint test build typecheck --exclude=tag:demo-frontend

      # Reports the run's task results to Nx Cloud. `always()` because the run
      # it reports on is the failing one.
      - run: npx nx fix-ci
        if: always()

  # The second gate (demo apps spec 10.1): every project tagged demo runs its
  # e2e suite here, against the workspace's packages, so a package change
  # that breaks an app goes red before it reaches an rc. The release workflow
  # requires the ruleset checks green on the commit it releases, and the
  # owner adds this one to the rulesets after three green runs on
  # release/0.4.
  #
  # It runs every demo on every run, with the Nx cache. `nx affected` would
  # skip the demos on a push whose parent changed nothing they depend on,
  # and leave that commit with a green check that tested nothing. A demo
  # joins through its tag, with no edit here.
  #
  # Budget: 8 minutes, so the run's wall time stays at main's.
  demo-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # The browsers are keyed by the Playwright version the lockfile
      # installs. A cache hit still needs the system libraries, which live
      # outside the cached folder.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npx nx run-many -t lint test typecheck --projects=tag:demo-frontend

      - run: npx nx run-many -t e2e --projects=tag:demo

  # The growth track's e2e cases (ship systems spec section 14). Each demo
  # app keeps them in an e2e-growth target, and only this job runs it. The
  # rulesets never require this check, so a red growth case shows on the run
  # and blocks no merge or release. A case moves into its app's e2e target,
  # and so into demo-apps, after a green rc cycle. Until the first growth
  # increment adds an e2e-growth target, Nx finds no task and the job passes.
  demo-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npx nx run-many -t e2e-growth --projects=tag:demo

  # The only check that reads a package as npm publishes it. Everything in
  # `main` resolves through `customConditions: ["@nexusdi/source"]`, which
  # reaches a package's TypeScript source and never its exports map, emitted
  # declarations or build output, so a package can pass every target there
  # and still install into a consumer as nothing importable.
  #
  # Its own job rather than a step in `main`, because it shares no work with
  # it: the script clears every `dist` and rebuilds with `--skip-nx-cache`, so
  # `main`'s build buys it nothing and it runs beside `main` instead of
  # behind it.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - run: npm run verify:packaging

  # Builds this tree as the /next/ site and as the root site, the way docs.yml
  # builds them, and checks an rc and a final artifact (docs spec §15.3). The
  # rc switch that PR #71 reverted, and a final root build with no blog on
  # main, both fail here before they merge. A change that touches no docs
  # input ends the job after the diff, so the job always reports and the
  # rulesets can require it.
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: List the docs inputs this change touches
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node apps/docs/tools/deploy/docs-changed.mjs "$BASE"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.touched == 'true'
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - if: steps.changed.outputs.touched == 'true'
        run: npm ci

      - name: Build the /next/ site
        if: steps.changed.outputs.touched == 'true'
        run: node apps/docs/tools/deploy/build-site.mjs next --tree . --out build/next-out

      # The tree stands in for both the release tag and main, so a tree with
      # no blog fails as the first final deploy would.
      - name: Build the root site
        if: steps.changed.outputs.touched == 'true'
        run: node apps/docs/tools/deploy/build-site.mjs root --tree . --main . --out build/root-out

      - name: Read deploy.json
        id: config
        if: steps.changed.outputs.touched == 'true'
        run: node apps/docs/tools/deploy/deploy-config.mjs apps/docs/deploy.json

      - name: Download and verify the snapshot
        if: steps.changed.outputs.touched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_ASSET: ${{ steps.config.outputs.root_asset }}
          ROOT_SHA256: ${{ steps.config.outputs.root_sha256 }}
          ARCHIVE_ASSET: ${{ steps.config.outputs.archive_asset }}
          ARCHIVE_SHA256: ${{ steps.config.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p build/assets build/snapshot-root build/snapshot-archive
          gh release download docs-snapshot-0.3 --pattern "$ROOT_ASSET" --pattern "$ARCHIVE_ASSET" --dir build/assets
          node apps/docs/tools/deploy/snapshot-assets.mjs verify "build/assets/$ROOT_ASSET" "$ROOT_SHA256"
          node apps/docs/tools/deploy/snapshot-assets.mjs verify "build/assets/$ARCHIVE_ASSET" "$ARCHIVE_SHA256"
          tar -xzf "build/assets/$ROOT_ASSET" -C build/snapshot-root
          tar -xzf "build/assets/$ARCHIVE_ASSET" -C build/snapshot-archive

      - name: Assemble and check the rc and final artifacts
        if: steps.changed.outputs.touched == 'true'
        run: |
          set -euo pipefail
          export NEXT_OUT=build/next-out ROOT_OUT=build/root-out
          export SNAPSHOT_ROOT=build/snapshot-root SNAPSHOT_ARCHIVE=build/snapshot-archive
          DEPLOY_MODE=rc SITE_DIR=site-rc node apps/docs/tools/deploy/assemble.mjs
          node apps/docs/tools/deploy/check-artifact.mjs site-rc rc
          DEPLOY_MODE=final SITE_DIR=site-final node apps/docs/tools/deploy/assemble.mjs
          node apps/docs/tools/deploy/check-artifact.mjs site-final final

  # Builds the packed @nexusdi/core with tsc 6, TypeScript 7, esbuild, SWC,
  # Babel, Vite (with and without the Babel plugin), Bun, Deno and Node's
  # type stripping, runs each build, and holds its output to one golden
  # file. Every toolchain version is pinned in
  # examples/toolchain-matrix/toolchains.json and installed from npm.
  #
  # Runs after packaging: it packs and installs the same tarball packaging
  # verifies, so a broken pack fails in packaging before this job spends
  # its install time.
  toolchain-matrix:
    needs: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - run: npx nx run @nexusdi/toolchain-matrix:matrix

  # Every other job runs the .nvmrc Node. @nexusdi/cli's engines field
  # promises 22.12, where Node has no type stripping by default and tsx
  # loads through a different path, so the cli tests run there too.
  #
  # Only the tests run on 22.12. The install and the build run on the .nvmrc
  # Node: the npm that ships with 22.12 reads the lockfile's optional
  # platform packages as missing, and Nx's project graph loads vite configs
  # that import TypeScript, which 22.12 cannot. The tests spawn the built
  # bin with the Node that runs them, so the second setup-node puts 22.12
  # first on PATH and vitest runs directly. `nx run` would rebuild the
  # project graph on 22.12.
  cli-node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - run: npx nx run @nexusdi/cli:build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0

      - run: node --version && npx vitest run
        working-directory: libs/cli

  # Vitest's typecheck mode checks the type tests on the workspace's
  # TypeScript. This checks the same files on the supported floor (5.4) and
  # on TypeScript 7.0.2, without Vitest.
  types-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - run: npm run check:type-floor

  # The bridge API's suite on each edge runtime the integrations spec names
  # (spec 9.8). One leg per runtime, so a red leg names the runtime. Runs on
  # every push and pull request with no path filter, so the rulesets can
  # require it. No step runs `nx run-many`: release-verify-gate holds the one
  # gate step in the main job.
  adapter-runtimes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [workerd, deno, bun, edge-runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - name: workerd
        if: matrix.leg == 'workerd'
        run: npx nx run @nexusdi/bridge-api:test-workers
        env:
          WRANGLER_SEND_METRICS: false

      # The versions examples/toolchain-matrix/toolchains.json pins;
      # runtime-leg.mjs refuses any other.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.leg == 'deno'
        with:
          deno-version: 2.9.6

      - name: Deno
        if: matrix.leg == 'deno'
        run: npx nx run @nexusdi/bridge-api:runtime-leg --leg=deno

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.leg == 'bun'
        with:
          bun-version: 1.4.2

      - name: Bun
        if: matrix.leg == 'bun'
        run: npx nx run @nexusdi/bridge-api:runtime-leg --leg=bun

      - name: Edge Runtime VM
        if: matrix.leg == 'edge-runtime'
        run: npx nx run @nexusdi/bridge-api:test-edge

  # Each adapter's tests against the floor and the newest release of every
  # framework line its peer range admits (integrations spec 13.4). The leg
  # list lives in scripts/adapter-peers.json; adapter-peers.test.ts holds
  # this matrix to it and each floor to the adapter's peer range. The runner
  # installs the leg with --no-save, checks the adapter resolves one copy,
  # and installs Chromium for the react legs.
  adapter-peers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg:
          - hono-floor
          - hono-latest
          - express-floor
          - express-latest
          - fastify-floor
          - fastify-latest
          - react-router-7-floor
          - react-router-7-latest
          - react-router-8-latest
          - react-floor
          - react-19-latest
          - vitest-floor
          - vitest-4-latest
          - vitest-5-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - name: Run the leg
        env:
          LEG: ${{ matrix.leg }}
        run: node scripts/adapter-peers.mjs "$LEG"

  # Every published lib promises Node 22.12 in engines, and the other jobs run
  # the .nvmrc Node. This runs each lib's tests on its floor, 22.22 for
  # react-router, whose React Router 8 peer needs it. Install and build run on
  # .nvmrc, as in cli-node-floor: the npm that ships with 22.12 reads the
  # lockfile's optional platform packages as missing. vitest runs directly,
  # because nx run would rebuild the project graph on the floor Node.
  # node-floor.test.ts derives this matrix from libs/.
  node-floor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lib: core, node: 22.12.0 }
          - { lib: decorators, node: 22.12.0 }
          - { lib: devtools, node: 22.12.0 }
          - { lib: errors, node: 22.12.0 }
          - { lib: express, node: 22.12.0 }
          - { lib: fastify, node: 22.12.0 }
          - { lib: federation, node: 22.12.0 }
          - { lib: hono, node: 22.12.0 }
          - { lib: interceptors, node: 22.12.0 }
          - { lib: node, node: 22.12.0 }
          - { lib: react, node: 22.12.0 }
          - { lib: react-router, node: 22.22.0 }
          - { lib: testing, node: 22.12.0 }
          - { lib: vitest, node: 22.12.0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # typecheck builds the spec project references (devtools and
      # interceptors reference decorators' spec project), whose out-tsc
      # declarations vitest's typecheck reads.
      - env:
          LIB: ${{ matrix.lib }}
        run: npx nx run "@nexusdi/$LIB:build" && npx nx run "@nexusdi/$LIB:typecheck"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: node --version && npx vitest run --configLoader runner
        working-directory: libs/${{ matrix.lib }}
