name: Release

# Every release event is a dispatch of this file (RELEASING.md). The same file
# sits on main, on every release/X.Y and on every X.Y.x, and the event decides
# what runs:
#
#   rc      release/X.Y   X.Y.0-rc.N, npm next
#   stable  release/X.Y   X.Y.0, npm latest; fast-forwards main in the same push
#   patch   main, X.Y.x   the patch conventional commits propose; latest or release-X.Y
#   sync    release/X.Y   opens a pull request merging main into the line
#   resume  any of those  finishes a release whose tag reached origin
#
# tools/release/lib.mjs makes every decision; tools/repo-checks holds its
# event table against the choice options below. Releasing cannot be undone
# (npm versions are immutable and tags are public), so a person dispatches
# every run, dry run first.
on:
  workflow_dispatch:
    inputs:
      event:
        description: 'Release event (RELEASING.md lists which branch each runs on)'
        type: choice
        options: [rc, stable, patch, sync, resume]
      dry-run:
        description: 'Dry run: print the plan, version, changelog and dist-tags, change nothing'
        type: boolean
        default: true

permissions:
  contents: write # release commit, tags, GitHub releases, sync branch
  pull-requests: write # the sync pull request
  id-token: write # npm OIDC for publish and dist-tag moves
  actions: write # dispatch docs.yml
  checks: read # the plan reads the required checks on the commit it releases

# GitHub keeps one pending run and cancels older pending ones, so two
# dispatches never interleave.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # npm's trusted publisher names this environment, and its deployment
    # branch policy admits main, release/* and [0-9]*.x only. RELEASE_SSH_KEY
    # lives in it, so a run on any other ref gets neither the key nor npm.
    environment: release
    env:
      HUSKY: '0'
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
      EVENT: ${{ inputs.event }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      # actions/checkout falls back to the job token when ssh-key is empty, and
      # that token cannot push past the rulesets. A dry run would then pass
      # having proved nothing about the real run's push.
      - name: Require the release deploy key
        env:
          KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::RELEASE_SSH_KEY is not set in the release environment. See RELEASING.md, \"Repository setup\"."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The plan reads every tag, and nx reads the history since the last
          # one.
          fetch-depth: 0
          filter: tree:0
          # Pushes authenticate as a write deploy key, the one actor every
          # ruleset in this repository lets bypass its pull request and
          # status check rules. It is git-write on this repository only; it
          # cannot publish to npm or change settings. RELEASING.md covers
          # rotating it.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      # The release commit and the sync merge both need an
      # identity.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache: what gets published is built from exactly
          # what the lockfile resolves to.

      # Trusted publishing needs npm >= 11.5.1. Below that the CLI does not
      # attempt the OIDC exchange and fails with an opaque auth error.
      - name: Check npm supports trusted publishing
        run: |
          required=11.5.1
          actual=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $actual is too old for trusted publishing (need >= $required)" >&2
            exit 1
          fi
          echo "npm $actual supports trusted publishing"

      - run: npm ci

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/plan.mjs

      - name: Merge main into a sync branch
        id: sync
        if: inputs.event == 'sync' && steps.plan.outputs.up_to_date != 'true'
        env:
          BRANCH: ${{ steps.plan.outputs.sync_branch }}
        run: |
          set -euo pipefail
          if node tools/release/sync.mjs merge "$BRANCH"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would push $BRANCH and open its pull request."
            git log --oneline -1
            git diff --stat HEAD~1 HEAD || true
          else
            # The deploy key pushes, so ci.yml and codeql.yml run on the
            # branch and report the required checks on its head.
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

      - name: Open the sync pull request
        if: steps.sync.outputs.merged == 'true' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.plan.outputs.sync_branch }}
          MAIN_SHA: ${{ steps.plan.outputs.main_sha }}
        run: |
          gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" \
            --title "chore(repo): sync main into $GITHUB_REF_NAME" \
            --body "Merges main at $MAIN_SHA into $GITHUB_REF_NAME. Merge with a merge commit (RELEASING.md, \"Branches\")."

      - name: Stop after a sync that needs a hand merge
        if: steps.sync.outputs.merged == 'false'
        run: exit 1

      # The later steps run these scripts. A resume checks out a tag that may
      # predate them, so they run from a copy taken here.
      - name: Keep the release scripts
        run: cp -R tools/release "$RUNNER_TEMP/release"

      # A resume rebuilds and publishes exactly what the tag holds, with the
      # dependencies the tag's lockfile resolves.
      - name: Check out the tag to resume
        if: inputs.event == 'resume'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git checkout --detach "$TAG"
          npm ci

      # core's test target depends on test-browser, which runs in Chromium.
      - name: Install Chromium
        if: inputs.event != 'sync'
        run: npx playwright install --with-deps chromium

      - name: Verify
        if: inputs.event != 'sync'
        # The target list CI runs, over every project.
        # tools/repo-checks/src/release-verify-gate.test.ts holds the two
        # lists against each other. A fixed release group publishes every
        # package, so no project filter applies, and `--affected` on a
        # dispatch compares a commit with itself and verifies nothing.
        run: npx nx run-many -t lint test build typecheck

      # Problems that exist only once a package is packed, such as emitted
      # .d.ts files a nodenext consumer cannot resolve.
      - name: Verify packaging
        if: inputs.event != 'sync'
        run: npm run verify:packaging

      # The old line's maintenance branch starts at main's head before main
      # moves to the new line.
      - name: Create the maintenance branch
        if: steps.plan.outputs.stable_tail == 'true' && steps.plan.outputs.maint_branch != ''
        env:
          MAINT: ${{ steps.plan.outputs.maint_branch }}
          MAIN_SHA: ${{ steps.plan.outputs.main_sha }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$MAINT" >/dev/null; then
            echo "$MAINT already exists."
          elif [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would create $MAINT at $MAIN_SHA."
          elif [ "$EVENT" = "resume" ]; then
            # main already moved to the new line, so its old head is the
            # previous line's newest tag.
            echo "::warning::$MAINT does not exist. Create it from the newest tag of its line by hand (RELEASING.md)."
          else
            git push origin "$MAIN_SHA:refs/heads/$MAINT"
          fi

      - name: Version
        if: inputs.event == 'rc' || inputs.event == 'stable' || inputs.event == 'patch'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          args=("$VERSION")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          echo "Running: nx release version ${args[*]}"
          npx nx release version "${args[@]}"

      - name: Changelog, commit, tag and push
        if: inputs.event == 'rc' || inputs.event == 'stable' || inputs.event == 'patch'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PUSH_REFS: ${{ steps.plan.outputs.push_refs }}
          # The GitHub release, and the author lookup of the changelog
          # renderer, which runs in a dry run too.
          GITHUB_TOKEN: ${{ github.token }}
        # One atomic push carries the release commit, every branch update and
        # the tag, or changes nothing. For stable that moves release/X.Y and
        # fast-forwards main together. nx places --git-push-args straight
        # after `git push --atomic`, so the remote has to be named or the
        # first refspec is read as one.
        run: |
          args=("$VERSION" --git-commit --git-tag --git-push --git-remote origin "--git-push-args=$PUSH_REFS")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          echo "Running: nx release changelog ${args[*]}"
          npx nx release changelog "${args[@]}"

      - name: Create the missing GitHub release
        if: inputs.event == 'resume' && steps.plan.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          LATEST: ${{ steps.plan.outputs.github_latest }}
        run: |
          node "$RUNNER_TEMP/release/notes.mjs" "$VERSION" > "$RUNNER_TEMP/notes.md"
          args=("$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "--latest=$LATEST")
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would run gh release create ${args[*]}"
            cat "$RUNNER_TEMP/notes.md"
          else
            gh release create "${args[@]}"
          fi

      # nx creates releases with make_latest: legacy, and GitHub does not
      # document whether date or version wins. Set it explicitly.
      - name: Set the latest GitHub release
        if: steps.plan.outputs.version != '' && !contains(steps.plan.outputs.version, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          LATEST: ${{ steps.plan.outputs.github_latest }}
          FIXUP: ${{ steps.plan.outputs.latest_fixup_tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would mark $TAG latest=$LATEST${FIXUP:+, then $FIXUP latest}."
            exit 0
          fi
          gh release edit "$TAG" "--latest=$LATEST"
          if [ -n "$FIXUP" ]; then gh release edit "$FIXUP" --latest; fi

      - name: Publish to npm
        if: inputs.event != 'sync' && steps.plan.outputs.all_published != 'true'
        env:
          DIST_TAG: ${{ steps.plan.outputs.dist_tag }}
          # No NODE_AUTH_TOKEN and no NPM_TOKEN. The npm CLI exchanges the
          # job's OIDC token for short-lived publish rights, which npm grants
          # only to release.yml in the release environment. Renaming this
          # file breaks publishing until the trusted publishers are updated.
          # Provenance is automatic under trusted publishing.
        # Never `nx run <project>:nx-release-publish`: it ignores --dryRun and
        # sends a real publish (release spec L11).
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would run nx release publish --tag $DIST_TAG"
            exit 0
          fi
          echo "Running: nx release publish --tag $DIST_TAG"
          npx nx release publish --tag "$DIST_TAG"

      - name: Reconcile npm dist-tags
        if: inputs.event != 'sync'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          DIST_TAG: ${{ steps.plan.outputs.dist_tag }}
          RESUME: ${{ inputs.event == 'resume' }}
        run: node "$RUNNER_TEMP/release/reconcile.mjs"

      # GitHub Pages admits main only, so docs.yml runs there and reads the
      # new tag. A dispatch with the job token starts a run.
      - name: Redeploy the docs site
        if: inputs.event != 'sync' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main

      # main now equals the line, and the line's tags stay reachable from it.
      - name: Delete the release branch
        if: steps.plan.outputs.stable_tail == 'true'
        run: |
          git fetch --quiet origin main
          if ! git ls-remote --exit-code --heads origin "refs/heads/$GITHUB_REF_NAME" >/dev/null; then
            echo "$GITHUB_REF_NAME is already gone."
          elif ! git merge-base --is-ancestor "origin/$GITHUB_REF_NAME" origin/main; then
            echo "::warning::$GITHUB_REF_NAME has commits main lacks, so it stays. Sync or delete it by hand."
          elif [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would delete $GITHUB_REF_NAME."
          else
            git push origin --delete "$GITHUB_REF_NAME"
          fi

      - name: Fail a dry run the real run would refuse
        if: always() && inputs.dry-run && steps.plan.outputs.blocked != ''
        run: |
          echo "::error::The plan found blockers (listed in the Plan step and the summary). The real run would stop before changing anything."
          exit 1
