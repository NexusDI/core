name: Release

# Manual trigger rather than publish-on-push. Releasing is the one thing in
# this repo that cannot be undone -- npm versions are immutable and tags are
# public -- so it stays a deliberate act.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run'
        type: boolean
        default: true
      specifier:
        description: >-
          Version specifier. Empty infers the bump from conventional commits
          (the normal path). Otherwise one of patch, minor, major, premajor,
          preminor, prepatch, prerelease, or an exact version (e.g. 1.2.3 or
          1.2.3-rc.0). See RELEASING.md's "Release candidates" section for
          the rc.0 -> rc.N -> stable flow.
        type: string
        default: ''
      preid:
        description: >-
          Prerelease identifier. Only takes effect when specifier is one of
          premajor/preminor/prepatch/prerelease.
        type: string
        default: 'rc'

permissions:
  contents: write # create tags and GitHub releases
  id-token: write # mint the OIDC token npm exchanges for publish rights
  actions: write # dispatch docs.yml after a publish

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx release reads the full history to infer versions from
          # conventional commits, and needs the tags to know where to start.
          fetch-depth: 0
          filter: tree:0
          # Check out over SSH with a write deploy key rather than the default
          # GITHUB_TOKEN.
          #
          # `nx release` pushes the version-bump commit and the tags straight to
          # main (it is forced on by changelog.projectChangelogs.createRelease:
          # "github" -- see nx's release.js, shouldPush). The main ruleset
          # requires a reviewed pull request, and github-actions[bot] cannot be
          # granted a bypass on a personal repository: the API rejects an
          # Integration bypass actor outside an organisation. A deploy key can
          # bypass, so the push authenticates as one.
          #
          # This key is git-write, this repo only. It cannot publish to npm --
          # that stays credential-free OIDC below -- and it cannot change repo
          # settings. Revoking it is deleting the deploy key. See RELEASING.md
          # for how it and the ruleset bypass entry are set up.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          # Deliberately no dependency cache. npm's guidance is that release
          # builds should not restore one, so what gets published is built
          # from exactly what the lockfile resolves to.

      # Trusted publishing needs npm >= 11.5.1. Below that the CLI does not
      # attempt the OIDC exchange at all and fails with an opaque auth error,
      # so check explicitly rather than letting a runner image change break a
      # release in a way that is hard to read.
      - name: Check npm supports trusted publishing
        run: |
          required=11.5.1
          actual=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $actual is too old for trusted publishing (need >= $required)" >&2
            exit 1
          fi
          echo "npm $actual supports trusted publishing"

      - run: npm ci

      # core's test target depends on test-browser (regression R20), which
      # runs in Chromium through Playwright.
      - run: npx playwright install --with-deps chromium

      - name: Verify
        # Same target list as CI. The release gate must not be weaker than
        # the pull request gate, and
        # tools/repo-checks/src/release-verify-gate.test.ts holds the two
        # target lists against each other.
        #
        # Over every project. nx.json's release group is fixed, so every
        # release versions and publishes all the packages under libs/, and
        # the gate covers the whole workspace they are built from.
        #
        # Never `--affected`. This workflow is workflow_dispatch on main,
        # where an affected comparison has the same commit on both sides, so
        # the affected set is empty and a gate scoped to it reports success
        # having verified nothing.
        run: npx nx run-many -t lint test build typecheck

      # Catches problems that only exist once the package is packed --
      # notably emitted .d.ts files that a nodenext consumer cannot resolve.
      # Everything inside the workspace resolves from source, so nothing
      # above sees these.
      - name: Verify packaging
        run: npm run verify:packaging

      # `nx release` commits the version bumps and tags them, so it needs an
      # identity.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version, changelog and tag
        id: version
        # Inputs reach the script as environment variables. A `${{ }}`
        # interpolation is substituted into the script text before the shell
        # sees it, so a dispatch input containing shell syntax would run as
        # part of this step.
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          SPECIFIER: ${{ inputs.specifier }}
          PREID: ${{ inputs.preid }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `nx release` publishes on its own unless told not to, so this step
        # passes --skip-publish -- without it, the Publish step below would
        # publish the same version a second time.
        #
        # --preid only accompanies an explicit pre* specifier. Passed
        # unconditionally it would also apply during conventional-commits
        # auto mode (empty SPECIFIER), turning an ordinary release into a
        # prerelease -- nx's own --preid description: "This will only be
        # applied in the case that the specifier argument has been set to
        # `prerelease` OR when conventional commits are enabled, in which
        # case it will modify the resolved specifier ... e.g. minor ->
        # preminor." Continuing an existing rc series (specifier=prerelease
        # or empty with the current version already a prerelease) needs no
        # --preid either: `semver.inc` carries the existing identifier
        # forward on its own (verified: rc.0 -> rc.1 with no --preid).
        run: |
          args=(--skip-publish)
          if [ -n "$SPECIFIER" ]; then args+=("$SPECIFIER"); fi
          case "$SPECIFIER" in
            premajor|preminor|prepatch|prerelease) args+=(--preid "$PREID") ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          echo "Running: nx release ${args[*]}"
          npx nx release "${args[@]}"

      - name: Resolve npm dist-tag
        id: tag
        # nx release publish does not pick a dist-tag by itself: unset
        # --tag falls through to npm's own default of "latest" regardless
        # of the version's shape (@nx/js/src/utils/npm-config.js,
        # getNpmTag). A prerelease version therefore has to be tagged
        # "next" explicitly, or it becomes the default install for
        # everyone. Read back the version the previous step just wrote
        # rather than re-deriving it, so this can never disagree with what
        # was actually versioned.
        #
        # One tag serves every package: the release group is fixed, so all
        # of them carry core's version, and nx release publish --tag applies
        # one value across the whole invocation.
        run: |
          version=$(node -p "require('./libs/core/package.json').version")
          # A semver prerelease is a hyphen after the X.Y.Z core and before
          # any +build metadata -- e.g. 0.4.0-rc.0, not 0.4.0 or
          # 0.4.0+20260101. A plain string match, not a semver library: the
          # version was just written by nx release itself, so it is
          # guaranteed well-formed.
          if [[ "$version" == *-* ]]; then
            tag=next
          else
            tag=latest
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved $version -> dist-tag $tag"

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          # No NODE_AUTH_TOKEN and no NPM_TOKEN, deliberately.
          #
          # The npm CLI detects the GitHub Actions OIDC environment and
          # exchanges the id-token granted above for short-lived publish
          # rights, scoped to this repository and this workflow filename.
          # There is no long-lived credential in this repo for anyone to
          # steal.
          #
          # Renaming this file breaks publishing until the trusted publisher
          # config on npmjs.com is updated -- npm matches it by filename.
          #
          # Provenance is automatic under trusted publishing, so neither
          # NPM_CONFIG_PROVENANCE nor --provenance is needed.
        run: |
          echo "Running: nx release publish --tag $TAG"
          npx nx release publish --tag "$TAG"

      - name: Redeploy the docs site
        # docs.yml no longer triggers on a release tag push: GitHub Pages'
        # default environment protection rule allows only the default
        # branch, and a tag push isn't one. Dispatch it from main, now that
        # the release tag it reads exists.
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
