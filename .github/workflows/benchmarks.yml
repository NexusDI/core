name: Benchmarks

# The cross-library harness of issue #21 (benchmarks spec section 4.8) and
# core's dispatch benchmark (core spec 17.3). Timings run only on the
# schedule, by hand and on a core tag; pull requests run the deterministic
# check, and the dispatch job when core's source, its bench harness or
# bench-kit changes.
on:
  pull_request:
    paths:
      - benchmarks/**
      - libs/core/**
      - examples/toolchain-matrix/**
      - tools/bench-kit/**
      - .nvmrc
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  push:
    tags:
      - '@nexusdi/core@*'

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.diff.outputs.core }}
      sensitivity: ${{ steps.diff.outputs.sensitivity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          if grep -qE '^libs/core/src/|^libs/core/bench/|^tools/bench-kit/src/' <<< "$changed"; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^libs/core/bench/|^tools/bench-kit/src/|^\.nvmrc$' <<< "$changed"; then
            echo "sensitivity=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitivity=false" >> "$GITHUB_OUTPUT"
          fi

  # The three deterministic writers against the workspace's packed core, with
  # --check, and the recipe consistency test. No timings.
  bench-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run @nexusdi/benchmarks:check

  # K14: fails when the hook sites cost more than 3% beyond the measured
  # noise. An inconclusive case runs 40 more pairs once, and then fails when
  # its median is above 1.03 (benchmarks spec 14.6).
  dispatch:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run @nexusdi/core:bench-dispatch
      - if: always()
        run: |
          {
            echo '```json'
            cat libs/core/tmp/bench/dispatch.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # K14 itself must still see a planted hook-site cost. The job plants a cost
  # at the canon site of get() and fails when K14 does not block it, and exits
  # 2 when the plant is too small on this runner (benchmarks spec 14.6). It
  # checks the harness and the V8 version, so a pull request that edits only
  # core's source skips it and the weekly run catches the get path growing back
  # to the inlining cliff.
  bench-sensitivity:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.sensitivity == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run @nexusdi/core:bench-sensitivity

  deterministic:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check out core at the newest release tag
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node benchmarks/src/release-core.ts --ref "$PUSHED_TAG"
      - run: npx nx run @nexusdi/benchmarks:matrix
      - run: npx nx run @nexusdi/benchmarks:probes
      - run: npx nx run @nexusdi/benchmarks:size
      - run: npx nx run @nexusdi/benchmarks:scale
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deterministic
          path: benchmarks/results/*.json

  # Pairs never cross rounds, so the two build fixtures run in parallel jobs
  # with the same seed, and the results job merges them.
  build-meridian-8:
    if: github.event_name != 'pull_request'
    needs: deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check out core at the newest release tag
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node benchmarks/src/release-core.ts --ref "$PUSHED_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deterministic
          path: benchmarks/results
      - run: node benchmarks/src/build.ts --fixture=meridian-8 --out=benchmarks/tmp/build-meridian-8.json --seed=${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-meridian-8
          path: benchmarks/tmp/build-meridian-8.json

  build-scale-200:
    if: github.event_name != 'pull_request'
    needs: deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check out core at the newest release tag
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node benchmarks/src/release-core.ts --ref "$PUSHED_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deterministic
          path: benchmarks/results
      - run: node benchmarks/src/build.ts --fixture=scale-200 --out=benchmarks/tmp/build-scale-200.json --seed=${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-scale-200
          path: benchmarks/tmp/build-scale-200.json

  timings:
    if: github.event_name != 'pull_request'
    needs: deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check out core at the newest release tag
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node benchmarks/src/release-core.ts --ref "$PUSHED_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deterministic
          path: benchmarks/results
      - run: node benchmarks/src/timings/orchestrator.ts --seed=${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings
          path: |
            benchmarks/results/timings/
            benchmarks/results/raw/

  # The scale suite's timings (scale spec 10.2): one job per shape and one
  # for the steady get-cycle, each keeping every library and size on one
  # machine. fail-fast cancels the rest when one fails, and merge needs every
  # part, so a partial file is never published. Timeouts follow the estimates
  # of section 10.2. It runs on every event except a pull request, as
  # `timings` does: the first dispatch run (38736285112) published a scale
  # file, so a core tag may now publish scale timings.
  scale:
    name: scale-${{ matrix.part }}
    if: github.event_name != 'pull_request'
    needs: deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - part: mixed
            timeout: 330
          - part: wide
            timeout: 120
          - part: deep
            timeout: 120
          - part: modular
            timeout: 120
          - part: mixed-async
            timeout: 120
          - part: steady
            timeout: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check out core at the newest release tag
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node benchmarks/src/release-core.ts --ref "$PUSHED_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deterministic
          path: benchmarks/results
      - run: node benchmarks/src/scale/timings.ts --part=${{ matrix.part }} --seed=${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scale-timings-${{ matrix.part }}
          path: benchmarks/results/scale-parts

  # Merges the measuring jobs' files without write access, since it runs
  # npm ci and repository scripts. The results job only commits and pushes.
  merge:
    needs: [deterministic, build-meridian-8, build-scale-200, timings, scale]
    # scale is skipped on a pull request, which does not reach this job.
    if: ${{ !cancelled() && needs.deterministic.result == 'success' && needs.build-meridian-8.result == 'success' && needs.build-scale-200.result == 'success' && needs.timings.result == 'success' && needs.scale.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # build.json records the core version it read from libs/, so the merge
      # reads the same release the measuring jobs built.
      - name: Check out core at the newest release tag
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node benchmarks/src/release-core.ts --ref "$PUSHED_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deterministic
          path: benchmarks/results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-meridian-8
          path: benchmarks/tmp
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-scale-200
          path: benchmarks/tmp
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: timings
          path: benchmarks/results
      - if: ${{ needs.scale.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scale-timings-*
          merge-multiple: true
          path: benchmarks/results/scale-parts
      - run: node benchmarks/src/build.ts --merge benchmarks/tmp/build-meridian-8.json benchmarks/tmp/build-scale-200.json
      - if: ${{ needs.scale.result == 'success' }}
        run: node benchmarks/src/scale/timings.ts --merge
      - run: node benchmarks/src/scale/render.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: benchmarks/results/

  # Write access, and no npm ci: open-results-pr.ts imports node builtins
  # only, and the push is the one step that authenticates.
  results:
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the results branch
      pull-requests: write # open the results pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: results
          path: benchmarks/results
      - name: Open the results pull request
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          REF_NAME: ${{ github.ref_name }}
        run: node benchmarks/src/open-results-pr.ts

  competitor-releases:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write # open one issue per newer competitor release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # competitor-releases.ts labels its issues benchmarks; --force makes
      # this a no-op when the label exists.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create benchmarks --repo "$GITHUB_REPOSITORY" --force --color 0e8a16 --description 'Benchmark harness upkeep'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node benchmarks/src/competitor-releases.ts
