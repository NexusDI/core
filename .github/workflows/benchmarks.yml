name: Benchmarks

# The cross-library harness of issue #21 (benchmarks spec section 4.8) and
# core's dispatch benchmark (core spec 17.3). Timings run only on the
# schedule, by hand and on a core tag; pull requests run the deterministic
# check, and the dispatch job when core's source changes.
on:
  pull_request:
    paths:
      - benchmarks/**
      - libs/core/**
      - examples/toolchain-matrix/**
      - tools/bench-kit/**
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  push:
    tags:
      - '@nexusdi/core@*'

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.diff.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -q '^libs/core/src/'; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi

  # The three deterministic writers against the workspace's packed core, with
  # --check, and the recipe consistency test. No timings.
  bench-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run @nexusdi/benchmarks:check

  # K14: fails when the hook sites cost more than 3% beyond the measured
  # noise. An inconclusive run passes (benchmarks spec 14.6).
  dispatch:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run @nexusdi/core:bench-dispatch
      - if: always()
        run: |
          {
            echo '```json'
            cat libs/core/tmp/bench/dispatch.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deterministic:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check out core at the newest release tag
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node benchmarks/src/release-core.ts --ref "$PUSHED_TAG"
      - run: npx nx run @nexusdi/benchmarks:matrix
      - run: npx nx run @nexusdi/benchmarks:probes
      - run: npx nx run @nexusdi/benchmarks:size
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic
          path: benchmarks/results/*.json

  # Pairs never cross rounds, so the two build fixtures run in parallel jobs
  # with the same seed, and the results job merges them.
  build-meridian-8:
    if: github.event_name != 'pull_request'
    needs: deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check out core at the newest release tag
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node benchmarks/src/release-core.ts --ref "$PUSHED_TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deterministic
          path: benchmarks/results
      - run: node benchmarks/src/build.ts --fixture=meridian-8 --out=benchmarks/tmp/build-meridian-8.json --seed=${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-meridian-8
          path: benchmarks/tmp/build-meridian-8.json

  build-scale-200:
    if: github.event_name != 'pull_request'
    needs: deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check out core at the newest release tag
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node benchmarks/src/release-core.ts --ref "$PUSHED_TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deterministic
          path: benchmarks/results
      - run: node benchmarks/src/build.ts --fixture=scale-200 --out=benchmarks/tmp/build-scale-200.json --seed=${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-scale-200
          path: benchmarks/tmp/build-scale-200.json

  timings:
    if: github.event_name != 'pull_request'
    needs: deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check out core at the newest release tag
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node benchmarks/src/release-core.ts --ref "$PUSHED_TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deterministic
          path: benchmarks/results
      - run: node benchmarks/src/timings/orchestrator.ts --seed=${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings
          path: |
            benchmarks/results/timings/
            benchmarks/results/raw/

  results:
    needs: [deterministic, build-meridian-8, build-scale-200, timings]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the results branch
      pull-requests: write # open the results pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # build.json records the core version it read from libs/, so the merge
      # reads the same release the measuring jobs built.
      - name: Check out core at the newest release tag
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node benchmarks/src/release-core.ts --ref "$PUSHED_TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deterministic
          path: benchmarks/results
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-meridian-8
          path: benchmarks/tmp
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-scale-200
          path: benchmarks/tmp
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timings
          path: benchmarks/results
      - run: node benchmarks/src/build.ts --merge benchmarks/tmp/build-meridian-8.json benchmarks/tmp/build-scale-200.json
      - name: Open the results pull request
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: node benchmarks/src/open-results-pr.ts

  competitor-releases:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write # open one issue per newer competitor release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node benchmarks/src/competitor-releases.ts
