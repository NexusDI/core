openapi: 3.0.3
info:
  title: Documentation Alignment API
  description: API for managing documentation content, examples, and validation
  version: 1.0.0
  contact:
    name: NexusDI Documentation Team
    email: docs@nexusdi.dev

servers:
  - url: https://docs.nexusdi.dev/api/v1
    description: Production server
  - url: https://staging-docs.nexusdi.dev/api/v1
    description: Staging server

paths:
  /articles:
    get:
      summary: List all documentation articles
      description: Retrieve a paginated list of documentation articles
      parameters:
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
            enum:
              [
                getting-started,
                concepts,
                modules,
                advanced,
                best-practices,
                api-reference,
              ]
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [draft, review, published, deprecated]
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of articles
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Article'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create a new documentation article
      description: Create a new documentation article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArticleRequest'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /articles/{id}:
    get:
      summary: Get a specific article
      description: Retrieve a specific documentation article by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Article ID
          schema:
            type: string
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update an article
      description: Update an existing documentation article
      parameters:
        - name: id
          in: path
          required: true
          description: Article ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticleRequest'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete an article
      description: Delete a documentation article
      parameters:
        - name: id
          in: path
          required: true
          description: Article ID
          schema:
            type: string
      responses:
        '204':
          description: Article deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /examples:
    get:
      summary: List all code examples
      description: Retrieve a paginated list of code examples
      parameters:
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
            enum: [basic, intermediate, advanced]
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [valid, broken, needs-update]
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of examples
          content:
            application/json:
              schema:
                type: object
                properties:
                  examples:
                    type: array
                    items:
                      $ref: '#/components/schemas/CodeExample'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create a new code example
      description: Create a new code example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExampleRequest'
      responses:
        '201':
          description: Example created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /examples/{id}/validate:
    post:
      summary: Validate a code example
      description: Run validation tests for a specific code example
      parameters:
        - name: id
          in: path
          required: true
          description: Example ID
          schema:
            type: string
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /search:
    get:
      summary: Search documentation
      description: Search across all documentation content using local search index
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
        - name: type
          in: query
          description: Content type filter
          schema:
            type: string
            enum: [article, example, api-reference]
        - name: category
          in: query
          description: Category filter
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  query:
                    type: string
                    description: The search query used
                  totalResults:
                    type: integer
                    description: Total number of results found
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /performance/metrics:
    get:
      summary: Get performance metrics
      description: Retrieve performance metrics for documentation
      parameters:
        - name: pageId
          in: query
          description: Filter by specific page ID
          schema:
            type: string
        - name: metric
          in: query
          description: Filter by metric type
          schema:
            type: string
            enum: [load-time, search-time, navigation-time, bundle-size]
        - name: startDate
          in: query
          description: Start date for metrics
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: End date for metrics
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Performance metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: array
                    items:
                      $ref: '#/components/schemas/PerformanceMetric'
                  summary:
                    $ref: '#/components/schemas/PerformanceSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - slug
        - content
        - category
        - status
        - lastUpdated
        - version
      properties:
        id:
          type: string
          description: Unique article identifier
        title:
          type: string
          description: Article title
        slug:
          type: string
          description: URL-friendly identifier
        content:
          type: string
          description: Markdown content
        category:
          type: string
          enum:
            [
              getting-started,
              concepts,
              modules,
              advanced,
              best-practices,
              api-reference,
            ]
        tags:
          type: array
          items:
            type: string
        lastUpdated:
          type: string
          format: date-time
        version:
          type: string
        status:
          type: string
          enum: [draft, review, published, deprecated]
        author:
          type: string
        reviewer:
          type: string
        dependencies:
          type: array
          items:
            type: string

    CodeExample:
      type: object
      required:
        - id
        - title
        - code
        - language
        - status
        - lastTested
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        code:
          type: string
        language:
          type: string
        category:
          type: string
          enum: [basic, intermediate, advanced]
        tags:
          type: array
          items:
            type: string
        testFile:
          type: string
        lastTested:
          type: string
          format: date-time
        status:
          type: string
          enum: [valid, broken, needs-update]
        dependencies:
          type: array
          items:
            type: string
        relatedArticles:
          type: array
          items:
            type: string

    PerformanceMetric:
      type: object
      required:
        - id
        - metric
        - value
        - unit
        - target
        - status
        - timestamp
      properties:
        id:
          type: string
        metric:
          type: string
        value:
          type: number
        unit:
          type: string
        target:
          type: number
        status:
          type: string
          enum: [pass, fail, warning]
        timestamp:
          type: string
          format: date-time
        pageId:
          type: string

    SearchResult:
      type: object
      required:
        - id
        - title
        - type
        - score
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [article, example, api-reference]
        category:
          type: string
        score:
          type: number
        url:
          type: string
        searchableContent:
          type: string
          description: Processed content optimized for local search
        metadata:
          type: object
          description: Additional search metadata for local search

    Pagination:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    CreateArticleRequest:
      type: object
      required:
        - title
        - content
        - category
      properties:
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        category:
          type: string
          enum:
            [
              getting-started,
              concepts,
              modules,
              advanced,
              best-practices,
              api-reference,
            ]
        tags:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            type: string

    UpdateArticleRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        category:
          type: string
          enum:
            [
              getting-started,
              concepts,
              modules,
              advanced,
              best-practices,
              api-reference,
            ]
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, review, published, deprecated]
        dependencies:
          type: array
          items:
            type: string

    CreateExampleRequest:
      type: object
      required:
        - title
        - code
        - language
      properties:
        title:
          type: string
        description:
          type: string
        code:
          type: string
        language:
          type: string
        category:
          type: string
          enum: [basic, intermediate, advanced]
        tags:
          type: array
          items:
            type: string
        relatedArticles:
          type: array
          items:
            type: string

    ValidationResult:
      type: object
      required:
        - id
        - status
        - timestamp
      properties:
        id:
          type: string
        status:
          type: string
          enum: [valid, broken, needs-update]
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        testResults:
          type: object
          properties:
            passed:
              type: integer
            failed:
              type: integer
            total:
              type: integer

    PerformanceSummary:
      type: object
      properties:
        averageLoadTime:
          type: number
        averageSearchTime:
          type: number
        averageNavigationTime:
          type: number
        totalBundleSize:
          type: number
        accessibilityScore:
          type: number
        lastUpdated:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
              details:
                type: object

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
