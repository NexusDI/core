<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" font-family="system-ui, sans-serif" font-size="12">
<title>Startup against providers, mixed</title>
<desc>Median startup in ms of each library on mixed graphs of 50, 200, 1,000, 2,500 and 5,000 providers, with the 5th to 95th percentile of each point. 1,000 measured rounds per size after 10 warm-up rounds, measured on AMD EPYC 9V74 80-Core Processor, 4 cores.</desc>
