<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" font-family="system-ui, sans-serif" font-size="12">
<title>Startup against providers</title>
<desc>Median startup of two libraries on mixed graphs of 50 to 5,000 providers.</desc>
<style>
svg{--bg:#ffffff;--ink:#1a1a19;--muted:#5f5f5b;--grid:#e3e3e0;--c0:#0072B2;--c1:#E69F00;--c2:#009E73;--c3:#CC79A7;--c4:#D55E00}
@media (prefers-color-scheme: dark){svg{--bg:#1a1a19;--ink:#ecece9;--muted:#a3a39e;--grid:#3a3a37;--c0:#308DCF;--c1:#C38603;--c2:#028964;--c3:#C976A4;--c4:#A84900}}
.bg{fill:var(--bg)}text{fill:var(--ink)}.muted{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1}.line{fill:none;stroke-width:2}.range{stroke-width:1.5;opacity:.55}
.swatch{stroke-width:3}.leader{stroke-width:1;opacity:.7}.dot{stroke:var(--bg);stroke-width:2}.end-marker path{fill:none;stroke-width:2.5}
.s0{stroke:var(--c0);color:var(--c0)}.dot.s0{fill:var(--c0)}
.s1{stroke:var(--c1);color:var(--c1)}.dot.s1{fill:var(--c1)}
.s2{stroke:var(--c2);color:var(--c2)}.dot.s2{fill:var(--c2)}
.s3{stroke:var(--c3);color:var(--c3)}.dot.s3{fill:var(--c3)}
.s4{stroke:var(--c4);color:var(--c4)}.dot.s4{fill:var(--c4)}
</style>
